# nginx-конфиг для мини-приложения, опубликованного по адресу
# https://quidditch.aurorhq.ru/worldmenu/
#
# Собранная статика лежит в /usr/share/nginx/html/worldmenu (см. Dockerfile),
# поэтому все ассеты доступны по путям /worldmenu/assets/*.

server {
    listen      80;
    listen      [::]:80;
    server_name _;

    root  /usr/share/nginx/html;
    index index.html;

    charset       utf-8;
    server_tokens off;

    gzip              on;
    gzip_vary         on;
    gzip_min_length   1024;
    gzip_proxied      any;
    gzip_types        text/plain text/css application/javascript application/json
                      image/svg+xml application/manifest+json;

    # Корень домена ведёт на приложение.
    # Если на этом домене живут и другие сервисы — удалите этот блок.
    location = / {
        return 302 /worldmenu/;
    }

    # /worldmenu -> /worldmenu/ (иначе относительные пути ассетов поедут)
    location = /worldmenu {
        return 301 /worldmenu/;
    }

    # Хешированные ассеты Vite можно кешировать навсегда.
    location /worldmenu/assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # index.html не кешируем, чтобы обновления подхватывались сразу.
    location = /worldmenu/index.html {
        add_header Cache-Control "no-cache";
    }

    # SPA: любой путь внутри /worldmenu/ отдаёт index.html.
    location /worldmenu/ {
        try_files $uri $uri/ /worldmenu/index.html;
    }

    # Healthcheck для Docker / балансировщика.
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }
}
