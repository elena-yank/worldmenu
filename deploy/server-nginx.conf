#  Применить изменения:
#
#    sudo nginx -t                 # проверить синтаксис
#    sudo systemctl reload nginx   # перечитать конфиг без простоя
#
#  Проверить, что контейнер отвечает напрямую:
#    curl -I http://127.0.0.1:8087/worldmenu/
#
#  Посмотреть итоговый конфиг (какой файл реально работает):
