# ============================================================================
#  Блок для СИСТЕМНОГО nginx на сервере (не для контейнера!)
#
#  Куда вставлять:
#    /etc/nginx/sites-enabled/<имя-твоего-сайта>   (Debian/Ubuntu)
#    /etc/nginx/conf.d/<имя-твоего-сайта>.conf     (RHEL/CentOS/Alpine)
#
#  Вставлять ВНУТРЬ уже существующего server { ... }, который обслуживает
#  https://quidditch.aurorhq.ru (там, где listen 443 ssl и server_name).
#
#  Что делает: запросы https://<домен>/worldmenu/... проксирует в Docker-контейнер
#  на http://127.0.0.1:8087/worldmenu/...
#
#  Почему proxy_pass, а не redirect на localhost:
#    redirect (return 302 http://localhost:8087/...) отправит БРАУЗЕР пользователя
#    на его собственный localhost — у всех, кроме самого сервера, будет ошибка.
#    Поэтому снаружи нужен reverse-proxy (proxy_pass), а не редирект.
# ============================================================================

# /worldmenu -> /worldmenu/ (иначе относительные пути ассетов поедут).
location = /worldmenu {
    return 301 /worldmenu/;
}

# ВАЖНО: proxy_pass указан БЕЗ завершающего слэша и без URI.
# Тогда префикс /worldmenu/ сохраняется: контейнер получает ровно /worldmenu/...
# Сборка Vite сделана под base: '/worldmenu/', поэтому префикс срезать нельзя.
location /worldmenu/ {
    proxy_pass http://127.0.0.1:8087;

    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host  $host;

    proxy_connect_timeout 10s;
    proxy_read_timeout    60s;
    proxy_send_timeout    60s;

    # Статика небольшая, но пусть будет с запасом.
    client_max_body_size 10m;
}

# Healthcheck контейнера (по желанию): https://<домен>/worldmenu-healthz
# location = /worldmenu-healthz {
#     access_log off;
#     proxy_pass http://127.0.0.1:8087/healthz;
# }

