services:
  worldmenu:
    build: .
    image: quidditch-worldmenu:latest
    container_name: quidditch-worldmenu
    restart: unless-stopped
    ports:
      # Контейнер слушает только localhost:8087 — снаружи его закрывает
      # системный nginx (см. deploy/server-nginx.conf), который проксирует
      # https://<домен>/worldmenu/ на http://127.0.0.1:8087/worldmenu/.
      # Если нужен прямой доступ по сети — замените на '8087:80'.
      - '127.0.0.1:8087:80'
